<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Account</title>

    <!-- Link to CSS -->
    <link rel="stylesheet" href="cart.css">
</head>

<body>

    <!-- =========================
         TOP SECTION
    ========================== -->

    <header class="top">

        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <span>Home</span>
            <span>/</span>
            <span>My Account</span>
        </div>

        <!-- Welcome text -->
        <div class="welcome">
            Welcome! <span>Md Rimel</span>
        </div>

    </header>


    <!-- =========================
         MAIN ACCOUNT SECTION
    ========================== -->

    <main class="account-container">


        <!-- =========================
             LEFT SIDEBAR
        ========================== -->

        <aside class="sidebar">

            <h3>Manage My Account</h3>

            <a href="#" class="active">My Profile</a>
            <a href="#">Address Book</a>
            <a href="#">My Payment Options</a>


            <h3 class="orders-title">My Orders</h3>

            <a href="#">My Returns</a>
            <a href="#">My Cancellations</a>


            <h3 class="wishlist-title">My Wishlist</h3>

        </aside>



        <!-- =========================
             RIGHT PROFILE SECTION
        ========================== -->

        <section class="profile">

            <h2>Edit Your Profile</h2>


            <!-- First Row -->
            <div class="form-row">

                <div class="form-group">

                    <label>First Name</label>

                    <input type="text" value="Md">

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input type="text" value="Rimel">

                </div>

            </div>



            <!-- Second Row -->
            <div class="form-row">

                <div class="form-group">

                    <label>Email</label>

                    <input type="email" value="rimel111@gmail.com">

                </div>


                <div class="form-group">

                    <label>Address</label>

                    <input type="text" value="Kingston, 5236, United State">

                </div>

            </div>



            <!-- Password Section -->

            <div class="password-section">

                <label>Password Changes</label>

                <input type="password" placeholder="Current Password">

                <input type="password" placeholder="New Password">

                <input type="password" placeholder="Confirm New Password">

            </div>



            <!-- Buttons -->

            <div class="buttons">

                <button class="cancel">
                    Cancel
                </button>

                <button class="save">
                    Save Changes
                </button>

            </div>

        </section>

    </main>

</body>

</html>
