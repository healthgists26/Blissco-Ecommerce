<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout Page</title>
    <link rel="stylesheet" href="cart.css">
</head>

<body>
    <div class="checkout-container">
        <!-- Breadcrumb -->
        <div class="breadcrumb">
            <span>Account</span>
            <span>/</span>
            <span>My Account</span>
            <span>/</span>
            <span>Product</span>
            <span>/</span>
            <span>View Cart</span>
            <span>/</span>
            <span>Checkout</span>
        </div>


        <!-- Main Checkout Area -->
        <div class="checkout">

            <!-- LEFT SIDE -->
            <div class="billing">

                <h1>Billing Details</h1>

                <form>

                    <label>First Name*</label>
                    <input type="text">


                    <label>Company Name</label>
                    <input type="text">


                    <label>Street Address*</label>
                    <input type="text">


                    <label>Apartment, floor, etc. (optional)</label>
                    <input type="text">


                    <label>Town/City*</label>
                    <input type="text">


                    <label>Phone Number*</label>
                    <input type="text">


                    <label>Email Address*</label>
                    <input type="email">


                    <div class="save-info">
                        <input type="checkbox" checked>
                        <span>Save this information for faster check-out next time</span>
                    </div>

                </form>

            </div>


            <!-- RIGHT SIDE -->
            <div class="order-box">

                <!-- Product 1 -->
                <div class="product">
                    <div class="product-left">
                        <div class="product-image red"></div>
                        <span>LCD Monitor</span>
                    </div>

                    <span>$650</span>
                </div>


                <!-- Product 2 -->
                <div class="product">
                    <div class="product-left">
                        <div class="product-image black"></div>
                        <span>H1 Gamepad</span>
                    </div>

                    <span>$1100</span>
                </div>


                <!-- Subtotal -->
                <div class="price-row">
                    <span>Subtotal:</span>
                    <span>$1750</span>
                </div>


                <!-- Shipping -->
                <div class="price-row">
                    <span>Shipping:</span>
                    <span>Free</span>
                </div>


                <!-- Total -->
                <div class="price-row total">
                    <span>Total:</span>
                    <span>$1750</span>
                </div>


                <!-- Payment -->
                <div class="payment">

                    <label>
                        <input type="radio" name="payment">
                        Bank
                    </label>

                    <div class="cards">
                        <span>VISA</span>
                        <span>MC</span>
                        <span>○</span>
                    </div>

                    <label>
                        <input type="radio" name="payment" checked>
                        Cash on delivery
                    </label>

                </div>


                <!-- Coupon -->
                <div class="coupon">

                    <input type="text" placeholder="Coupon Code">

                    <button type="button">
                        Apply Coupon
                    </button>

                </div>


                <!-- Place Order -->
                <button class="place-order">
                    Place Order
                </button>

            </div>

        </div>

    </div>
</body>

</html>
