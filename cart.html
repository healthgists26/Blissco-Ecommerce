<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cart.css">
    <title>Cart</title>
</head>

<body>
    <div class="container">
        <div class="breadcrumb">
            <span>Home</span>
            <span>/</span>
            <span>Cart</span>
        </div>

        <div class="cart">
            <div class="cart-header">
                <div>Product</div>
                <div>Price</div>
                <div>Quantity</div>
                <div>Subtotal</div>
            </div>

            <div class="cart-item">
                <div class="product">
                    <button class="remove">×</button>
                    <img src="Images\Cartspeaker.png">
                    <span>LCD Monitor</span>
                </div>
                <div class="price">$650</div>
                <div>
                    <input type="number" value="1" min="1">
                </div>
                <div class="subtotal">$650</div>
            </div>
            <div class="cart-item">
                <div class="product">
                    <button class="remove">×</button>
                    <img src="Images\Cartbag.png">
                    <span>H1 Gamepad</span>
                </div>
                <div class="price">$550</div>
                <div>
                    <input type="number" value="2" min="1">
                </div>
                <div class="subtotal">$1100</div>
            </div>
            <div class="cart-buttons">
                <button class="return-btn">
                    Return To Shop
                </button>
                <button class="update-btn">
                    Update Cart
                </button>
            </div>
            <div class="bottom-section">
                <div class="coupon">
                    <input type="text" placeholder="Coupon Code">
                    <button>
                        Apply Coupon
                    </button>
                </div>
                <div class="cart-total">
                    <h2>Cart Total</h2>
                    <div class="total-row">
                        <span>Subtotal:</span>
                        <span>$1750</span>
                    </div>
                    <div class="total-row">
                        <span>Shipping:</span>
                        <span>Free</span>
                    </div>
                    <div class="total-row total">
                        <span>Total:</span>
                        <span>$1750</span>
                    </div>
                    <button class="checkout">
                        Proceed to checkout
                    </button>
                </div>

            </div>

        </div>

    </div>

</body>

</html>
</body>

</html>
